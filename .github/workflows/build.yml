name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个分支/标签的重复触发只保留最新一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: 构建 Windows 绿色版
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust（stable / msvc）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ runner.os }}-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 版本号一致性（package.json / Cargo.toml / tauri.conf.json / package-lock）
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = ((Get-Content src-tauri/Cargo.toml | Select-String '^version\s*=').Line -replace '.*"([^"]+)".*', '$1')
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $lock = ([System.IO.File]::ReadAllText('package-lock.json') | ConvertFrom-Json -AsHashtable).version
          Write-Host "package.json=$pkg Cargo.toml=$cargo tauri.conf.json=$conf package-lock.json=$lock"
          $bad = @()
          if ($pkg -ne $cargo) { $bad += "Cargo.toml($cargo) != package.json($pkg)" }
          if ($pkg -ne $conf) { $bad += "tauri.conf.json($conf) != package.json($pkg)" }
          if ($pkg -ne $lock) { $bad += "package-lock.json($lock) != package.json($pkg)" }
          if ($bad.Count -gt 0) { throw ("版本号不一致：" + ($bad -join '; ')) }

      - name: 前端类型检查
        run: npx tsc --noEmit

      - name: 契约自检（860+ 项 JSON 断言）
        shell: pwsh
        run: pwsh -NoProfile -File dev/verify.ps1

      - name: Rust 静态检查（clippy 零警告）
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust 测试（含契约反序列化回环）
        working-directory: src-tauri
        run: cargo test --locked

      - name: 构建单文件 exe（不出安装器）
        run: npm run app:build

      - name: 重命名为发布名
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/*.exe |
            Where-Object { $_.Name -notmatch '(?i)setup|uninst' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "没有找到构建产物" }
          # 用 ASCII 文件名：GitHub Releases 会丢弃资源名里的非 ASCII 字符，
          # 此前用「爱弥斯·环境检测.exe」上传后变成了「-v1.3.1-.exe」/「default.exe」。
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assetName = "EmisEnvCheck-v$version-windows-x64.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe.FullName "release/$assetName" -Force
          $size = [math]::Round((Get-Item "release/$assetName").Length / 1MB, 2)
          Write-Host "产物：$assetName  体积：$size MB"
          "EXE_SIZE=$size" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ASSET_NAME=$assetName" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # 绿色版 zip（exe + 使用说明），同样用 ASCII 名
          $zipName = "EmisEnvCheck-v$version-portable.zip"
          $readme = @"
          爱弥斯 · 环境检测 v$version
          制作 清吾 · https://qingwu.ink

          【怎么用】
          1. 把「$assetName」放到任意目录（桌面 / U 盘 / 移动硬盘都行）
          2. 双击运行，不需要安装
          3. 想要温度、硬盘 SMART、TPM 等深度数据，点界面上的「以管理员重启」

          【系统要求】
          - Windows 10 1809+ / Windows 11（64 位）
          - 运行时依赖系统自带 WebView2

          【绿色承诺】
          - 不写注册表、不装服务、不进开机启动
          - 不联网上传任何数据（外网探测那一项只做连通性 ping）

          【许可】
          MIT © 清吾
          "@
          $readmePath = Join-Path (Resolve-Path release) '使用说明.txt'
          [System.IO.File]::WriteAllText($readmePath, $readme, (New-Object System.Text.UTF8Encoding($true)))
          Compress-Archive -Path "release/$assetName", $readmePath -DestinationPath "release/$zipName" -CompressionLevel Optimal
          $zipSize = [math]::Round((Get-Item "release/$zipName").Length / 1MB, 2)
          Write-Host "压缩包：$zipName  体积：$zipSize MB"
          "ZIP_SIZE=$zipSize" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ZIP_NAME=$zipName" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: emis-envcheck-windows-x64
          path: |
            release/EmisEnvCheck-*-windows-x64.exe
            release/EmisEnvCheck-*-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/EmisEnvCheck-*-windows-x64.exe
            release/EmisEnvCheck-*-portable.zip
          name: ${{ github.ref_name }} · 爱弥斯 · 环境检测
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 爱弥斯 · 环境检测 ${{ github.ref_name }}

            绿色版单文件 exe，**免安装**，下载后双击即可。

            - 单文件体积：${{ env.EXE_SIZE }} MB ｜ 压缩包：${{ env.ZIP_SIZE }} MB
            - 系统要求：Windows 10 1809+ / Windows 11（64 位），需要系统自带 WebView2
            - 深度数据（温度 / SMART / TPM）需要管理员权限，界面里可一键提权

            制作 清吾 · [qingwu.ink](https://qingwu.ink)
